#cargo-features = ["build-std"]

[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rand = "0.10.1"
regex-lite = "0.1.9"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "3.0.0-rc.0", features = ["static_secrets"] }
base64 = "0.22.1"
ipnet = { version = "2.12.0", features = ["default", "serde"] }
openport = { version = "0.3.0", features = ["default", "rand"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
icmp-socket = "0.2.0"
#wstunnel = { git = "https://github.com/owenpmckenna/wstunnel", package = "wstunnel" }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
