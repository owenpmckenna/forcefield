#cargo-features = ["build-std"]

[package]
name = "generator"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
crossbeam-channel = "0.5.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rsa = "0.10.0-rc.18"
rand = "0.10.1"
chacha20poly1305 = "0.10"
ipnet = { version = "2.12.0", features = ["default", "serde"] }
minreq = { version = "3.0.0", features = ["https-rustls-probe"] }
icmp-socket = "0.2.0"
nix = { version = "0.31.3", features = ["fs"] }
polling = "3.11.0"
#wstunnel = { git = "https://github.com/owenpmckenna/wstunnel", package = "wstunnel" }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
